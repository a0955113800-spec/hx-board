<style>
/* 宏軒組版：主色換成石板灰藍 #3d5566（色階、水位跟著換），警示橘不變。以下沿用小郭組版說明——
   設計語言（2026-10-22 第三版：taste-skill 工作畫面風格 accent-ladder「色階」，綠＋橘）
   分工：墨綠 #22684f 是主色——額度格、主按鈕、目前頁、使用中；
         赭橘 #b4540a 只用在要注意的地方——額度最後兩格（90% 以上）、已滿／快滿、等驗證碼的數字。
   色階＝佔用程度：5 小時額度 20 格、每格 5%，由淺綠一路變深綠，到 90% 轉成橘（像油表進紅區）。
   狀態：● 可用＝白底綠框；◐ 使用中＝淡綠；× 已滿／快滿＝橘；？ 可能忘了結束＝灰。
   字：DM Sans＋思源黑體；數字一律等寬（tabular-nums）。
   版面：桌機側欄 230 ＋ 內容（1fr＋384 側欄，間距 24）；手機側欄收成頂端列。
   動效（有語意）：別人更新時那個帳號那一列閃一下淡黃；本週額度條從上次的長度長到新長度。 */
:root{
  --ground:#f6f7f8;--surface:#fff;--raised:#f3f4f6;--border:#e5e7eb;--rule:#f2f2f2;--control:#d1d5db;
  --text:#111827;--muted:#525863;--accent:#3d5566;--mid:#8a9dab;--soft:#eff3f5;--track:#d5dee4;--accent-ink:#22323d;
  --warm:#b4540a;--warm-mid:#d98f4e;--warm-soft:#fdf4ea;--warm-track:#f6dcc2;--warm-ink:#7a3807;
  --pos-bg:#fff;--pos-ink:#22323d;--pos-line:#d5dee4;--idle-bg:#f3f4f6;--idle-ink:#4b5563;--flash:#fff7d6;
  --r-card:8px;--r-ctl:6px;--gap:24px;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text)}
html{background:var(--ground)} /* body 不上底色，背景的額度水位（z-index:-1）才透得出來 */
body{font:14px/1.5 "DM Sans","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.muted{color:var(--muted);font-size:14px;margin:0}
.warn{font-size:13px;color:var(--warm-ink)}

/* 外框：側欄＋內容 */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 4px;font-weight:700;font-size:15px}
.ico{display:inline-flex;flex:none}
.mk{fill:var(--accent)}.mk2{fill:var(--mid)}.mk1{fill:var(--track)}.mkw{fill:var(--warm)}
.scope{padding:0 10px 22px;color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:6px;background:none;color:#3d4350;text-align:left;margin-bottom:2px}
.nav svg{stroke:#5f6672}
.nav:hover{background:var(--raised)}
.nav.on{background:var(--soft);color:var(--accent-ink);font-weight:500}
.nav.on svg{stroke:var(--accent)}
.nav .n{margin-left:auto;font-size:12px;color:var(--warm-ink);background:var(--warm-track);border-radius:999px;padding:0 7px}
.gl{padding:22px 10px 8px;font-size:12px;color:var(--muted)}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--border);font-size:13px}
.user small{display:block;color:var(--muted)}
.ptop{display:none}
.link{border:0;background:none;color:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:500}
.av.w{background:var(--warm-soft);color:var(--warm-ink)}

.canvas{padding:32px 32px 56px;max-width:1360px;display:flex;flex-direction:column;gap:16px}
.title{display:flex;align-items:flex-end;gap:16px}
h1{font-size:32px;font-weight:700;margin:0;line-height:1.2}
.title p{margin:6px 0 0;color:var(--muted);font-size:15px;max-width:62ch}
.title .act{margin-left:auto;display:flex;gap:8px;flex:none}
.stamp{color:var(--muted);font-size:12px;margin-top:-4px}
.note{font-size:14px;padding:10px 14px;border-radius:var(--r-card);background:var(--soft);color:var(--accent-ink);border:1px solid var(--track);display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.note b{font-weight:600}
.note .warn{flex-basis:100%}
.note.w{background:var(--warm-soft);color:var(--warm-ink);border-color:var(--warm-track)}

/* 按鈕 */
.btn{height:36px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--control);background:#fff;font-size:14px;font-weight:500;line-height:1.2;transition:background-color .15s}
.btn:hover{background:#fafafa}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1b5541}
.btn.ghost{background:transparent}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn.big{height:44px}
.btn.wide{width:100%}
.btn.danger{color:#b42318;border-color:#f0c4be}
.btn:focus-visible,.nav:focus-visible,.opt:focus-visible,.chip-b:focus-visible,.link:focus-visible,.seg button:focus-visible{outline:3px solid #9cc9b5;outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* 主欄＋右側欄 */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:var(--gap);align-items:start}
.main{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:18px 20px}
.kpi+.kpi{border-left:1px solid var(--border)}
.kpi .l{font-size:14px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;margin:2px 0}
.kpi .v.lead{font-size:32px}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:400}
.kpi .c{font-size:12px;color:var(--muted)}
.ch{display:flex;align-items:baseline;gap:12px;padding:18px 20px 4px;flex-wrap:wrap}
.ch h2{font-size:18px;font-weight:600;margin:0;white-space:nowrap}
.ch small{color:var(--muted);font-size:12px}

/* 一個帳號一列 */
.q{padding:14px 20px 16px;border-top:1px solid var(--rule)}
.q:first-of-type{border-top:0}
.q.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,20%{background:var(--flash)}to{background:transparent}}
.qt{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.qt b{font-size:15px;font-weight:600}
.qt .home{color:var(--muted);font-size:12px}
.qt .fig{margin-left:auto;font-size:14px}
.qt .fig b{font-size:16px}
.qt .fig b.hot{color:var(--warm-ink)}
.qt .fig span{color:var(--muted)}
.who{margin-top:8px;font-size:13px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.who b{color:var(--text);font-weight:500}
.who .tag{margin:0}
.who .acts{margin-left:auto;display:flex;gap:14px;white-space:nowrap}
.who .acts .link{color:var(--accent-ink);font-size:13px}
.full-n{font-size:13px;color:var(--warm-ink);margin:-2px 0 8px}
.full-n.old{color:var(--idle-ink)}

/* 色階：20 格，每格 5%；90% 以上兩格是橘 */
.steps{position:relative;display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;height:22px}
.steps i{position:relative;background:#f3f4f6;border-radius:3px;overflow:hidden}
.steps i:nth-child(n+19){background:var(--warm-soft)}
.steps i b{position:absolute;inset:0 auto 0 0}
.steps .ref{position:absolute;left:calc(90% + 1px);top:-6px;bottom:-6px;border-left:1px dashed var(--warm-ink)}
.scale-l{position:relative;height:18px;font-size:11px;color:var(--muted)}
.scale-l span{position:absolute;top:4px;transform:translateX(-50%)}
.scale-l span:first-child{transform:none}.scale-l span:last-child{transform:translateX(-100%)}
.track{position:relative;height:8px;background:var(--track);border-radius:999px}
.track i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent);transition:width .8s cubic-bezier(.2,.75,.2,1)}
.track.hi i{background:var(--warm)}

/* 狀態 */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--pos-bg);color:var(--pos-ink);border-color:var(--pos-line)}
.pill.busy{background:var(--soft);color:var(--accent-ink);border-color:var(--track)}
.pill.full{background:var(--warm);color:#fff}
.pill.idle{background:var(--idle-bg);color:var(--idle-ink)}
.tag{display:inline-block;font-size:11px;line-height:1.6;padding:0 6px;border-radius:999px;background:var(--raised);color:#3d4350;margin-left:6px;white-space:nowrap;font-weight:500;vertical-align:1px}
.tag.ink{background:var(--text);color:#fff}
.tag.gray{background:var(--idle-bg);color:var(--idle-ink)}
.tag.warm{background:var(--warm-soft);color:var(--warm-ink)}

/* 右側欄 */
.rail h3{font-size:16px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.rail h3 .n{font-size:12px;color:var(--warm-ink);background:var(--warm-track);border-radius:999px;padding:0 7px;font-weight:500}
.rail .card+h3{margin-top:16px}
.row{display:flex;align-items:center;gap:12px;min-height:45px;padding:8px 16px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row .sp{flex:1}
.row small{display:block;color:var(--muted);font-size:12px}
.row .t{font-size:13px;color:var(--muted);white-space:nowrap}
.row .t.on{color:var(--accent-ink);font-weight:500}
.more{display:block;margin:0 16px 14px;height:30px;width:calc(100% - 32px);border:1px solid var(--control);border-radius:6px;background:#fff;font-size:13px}
.empty{padding:14px 16px;color:var(--muted);font-size:13px}

/* 底部視窗 */
.sheet-bg{position:fixed;inset:0;background:rgba(17,24,39,.32);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s ease-out}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:12px 12px 0 0;max-height:92vh;overflow:auto;padding:4px 20px calc(18px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.75,.2,1)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:12px;padding-bottom:20px}}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet-h{display:flex;align-items:center;padding:14px 0 2px}.sheet-h h2{margin:0;font-size:18px;font-weight:600}
.x{margin-left:auto;border:0;background:none;font-size:26px;cursor:pointer;line-height:1;padding:4px 8px;color:var(--muted)}
.sheet-b{display:flex;flex-direction:column;gap:10px;padding:6px 0 16px}
.sheet-f{display:flex;flex-direction:column;gap:8px}
.lab{font-size:13px;color:var(--muted);margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--control);background:#fff;border-radius:var(--r-card);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;min-height:78px}
.opt b{font-size:15px}.opt small{font-size:12.5px;font-weight:500;color:var(--muted)}.opt small i{font-style:normal}.opt em{font-style:normal;font-size:12px;color:var(--muted)}
.opt.st-full small{color:var(--warm-ink)}.opt.st-ok small{color:var(--pos-ink)}.opt.st-busy small{color:var(--accent-ink)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-b{border:1px solid var(--control);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;min-height:38px}
.chip-b.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field>span:first-child{min-width:112px;font-size:14px;color:var(--muted)}
.field small{color:var(--muted);font-size:13px}
.in{border:1px solid var(--control);border-radius:var(--r-ctl);padding:8px 12px;font:inherit;font-size:16px;background:#fff;min-height:42px;color:var(--text);max-width:100%}
.in.num{width:96px;text-align:right}
.in.w{width:100%}
textarea.in{width:100%;resize:vertical;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:var(--r-ctl);font-size:14px;z-index:80;max-width:calc(100% - 32px);text-align:center;animation:up .22s ease-out}

/* 登入畫面 */
.gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--ground);padding:16px;overflow:auto}
.gate .box{max-width:460px;width:100%;background:#fff;border:1px solid var(--border);border-radius:12px;padding:28px 24px}
.gate h1{font-size:22px;margin:0 0 6px}.gate p{color:var(--muted);font-size:15px;line-height:1.75;margin:8px 0 18px}
.gate .gb{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.gate .btn{height:44px}
.names{display:flex;flex-direction:column;gap:12px;margin:4px 0 16px}
.names .grp b{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.names .grp div{display:flex;flex-wrap:wrap;gap:8px}

/* 後台 */
.admin .sec{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);padding:18px 20px}
.sec>h2{font-size:17px;font-weight:600;margin:0}.sec>.sub{font-size:13px;color:var(--muted);margin:2px 0 12px}
.sec .body{display:flex;flex-direction:column;gap:10px}
.sec .row{padding:10px 0;min-height:0;font-size:14px;flex-wrap:wrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.t th,table.t td{padding:8px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:400;font-size:12px;white-space:nowrap}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:inline-flex;background:var(--raised);border-radius:8px;padding:3px}
.seg button{border:0;background:none;height:28px;padding:0 14px;border-radius:6px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--text);font-weight:500}
.mrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,1.6fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.mrow.hd{font-size:12px;color:var(--muted);padding-top:0}
.mrow .in{min-height:38px;padding:6px 10px;font-size:15px;width:100%}
.mrow .em{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.sum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ablk{border:1px solid var(--border);border-radius:var(--r-card);padding:12px;display:flex;flex-direction:column;gap:8px}
.ablk .field>span:first-child{min-width:96px}
.ablk .in{min-height:38px;padding:6px 10px;font-size:15px}

@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}.side{display:none}
  .ptop{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--ground);position:sticky;top:0;z-index:20}
  .ptop b{font-size:15px}.ptop .sp{flex:1}.ptop .link{font-size:14px}
  .canvas{padding:16px 16px 40px}
  h1{font-size:24px}.title{display:block}.title .act{margin-top:12px;flex-wrap:wrap}.title .act .btn{flex:1 1 40%;height:44px}.title .act .btn.primary{flex-basis:100%}
  .kpis{grid-template-columns:1fr 1fr}.kpi:first-child{grid-column:1/-1;border-bottom:1px solid var(--border)}
  .kpi+.kpi{border-left:0}.kpi:last-child{border-left:1px solid var(--border)}
  .qt .fig{margin-left:0;width:100%}
  .ch small{flex-basis:100%;margin-top:-6px}
  .who .acts{margin-left:0;width:100%}
  .mrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mrow.hd{display:none}.mrow>button{justify-self:end}
  .opts{grid-template-columns:minmax(0,1fr)}.opt{min-height:0;flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


/* 帳號分組：一個帳號一列，名牌（.nt）排成一排；自己綠框、正在用淡綠底加 ◐ */

<script>
/* 宏軒組 AI 帳號看板：畫面與邏輯。後端由 window.BK 提供（正式版 fb.js；本機測試 fake.js） */
(function () {
'use strict';
const BK = window.BK;
// 組別設定：別組要用時只改這一段（組名、側欄單位、帳號、預設名單）
const GROUP = { name: '宏軒組', unit: '長豐工程顧問' };
const ACCTS = ['a1', 'a2', 'a3'];
const DEF_ACCT = { a1: GROUP.name + '1', a2: GROUP.name + '2', a3: GROUP.name + '3' };
// 預設名單 [姓名, 職稱, 帳號]：第一次登入的管理者可一鍵帶入，之後到後台調整
// 分組照使用者 10/27 指定；管理者：楊士毅（Firebase、GitHub 擁有者，未分組）＋張倫維、楊家榕（後台「管理者名單」填 Gmail）
const SEED = [
  ['吳易津', '', 'a1'], ['楊家榕', '', 'a1'], ['陳映綺', '', 'a1'], ['王玟涵', '', 'a1'],
  ['周雅祺', '', 'a2'], ['張倫維', '', 'a2'], ['王羿涵', '', 'a2'],
  ['彭毅軒', '', 'a3'], ['鄭正儀', '', 'a3'], ['楊先驛', '', 'a3'], ['高宏軒', '', 'a3'],
  ['楊士毅', '', '']
];
const PURPOSES = ['一般問答', '寫報告', '讀大量檔案', 'Claude Code'];
const LEVELS = ['重', '中', '輕'];
const WD = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
const MIN = 6e4, HR = 36e5, H3 = 3 * HR, H5 = 5 * HR, DAY = 864e5;
const SYM = { ok: '●', busy: '◐', full: '×', idle: '？' };
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

const S = { user: null, admin: false, bind: null, access: null, members: [], accts: {}, recent: [], open: [], logins: [], binds: [], plans: [], planDay: 0, tab: 'home', week: 0 };
const root = document.getElementById('app');

/* ---------- 小工具 ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else if (k === 'style') el.style.cssText = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v; else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false && c !== '') el.append(c.nodeType ? c : String(c));
  return el;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const when = t => {
  const n = Date.now(), d = new Date(t);
  if (sameDay(t, n)) return hm(t); if (sameDay(t, n - DAY)) return '昨天 ' + hm(t); if (sameDay(t, n + DAY)) return '明天 ' + hm(t);
  return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()].slice(1) + '）' + hm(t);
};
const whenW = t => (sameDay(t, Date.now()) ? '今天 ' : sameDay(t, Date.now() + DAY) ? '明天 ' : WD[new Date(t).getDay()] + ' ') + hm(t);
const dur = ms => { const m = Math.max(0, Math.round(ms / MIN)); return m < 60 ? m + ' 分' : Math.floor(m / 60) + ' 小時' + (m % 60 ? ' ' + (m % 60) + ' 分' : ''); };
const ago = t => { const m = Math.round((Date.now() - t) / MIN); return m < 1 ? '剛剛' : m < 60 ? m + ' 分鐘前' : m < 1440 ? Math.floor(m / 60) + ' 小時前' : when(t); };
const tag = (t, c) => h('span', { class: 'tag' + (c ? ' ' + c : '') }, t);
// 「16:40」→ 下一個 16:40 的時間戳（比現在早就算明天）
const timeToTs = v => { const [a, b] = v.split(':').map(Number), d = new Date(); d.setHours(a, b, 0, 0); let t = d.getTime(); if (t <= Date.now()) t += DAY; return t; };
const toLocal = t => { if (!t) return ''; const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + hm(t); };
const fromLocal = v => (v ? new Date(v).getTime() : null);
const weekStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime() - ((d.getDay() + 6) % 7) * DAY; };
const pct = v => { if (v === '' || v == null) return null; const x = Math.round(Number(v)); return isFinite(x) ? Math.min(100, Math.max(0, x)) : null; };

let toastT;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove()); clearTimeout(toastT);
  const el = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(el);
  toastT = setTimeout(() => el.remove(), 2600);
}
// 自己剛做的動作不算「別人更新」，不閃底
let lastLocal = 0;
async function act(fn, ok) {
  lastLocal = Date.now();
  try { await fn(); lastLocal = Date.now(); if (ok) toast(ok); return true; }
  catch (e) { toast('沒有成功：' + ((e && (e.message || e.code)) || '請再試一次')); return false; }
}

/* ---------- 資料 ---------- */
const mem = id => S.members.find(m => m.id === id);
const mname = (id, fb) => (mem(id) || {}).name || fb || '（已刪除）';
const acct = id => S.accts[id] || {};
const aname = id => acct(id).name || DEF_ACCT[id] || id;
const me = () => (S.bind ? mem(S.bind.mid) : null);
const myId = () => (S.bind ? S.bind.mid : '');
const allSess = () => { const m = new Map(); S.recent.concat(S.open).forEach(s => m.set(s.id, s)); return [...m.values()]; };
const openOf = id => S.open.filter(s => s.acct === id && !s.end);
const lastAct = s => s.touched || s.start;
const stale = s => Date.now() - lastAct(s) >= H3;
const sessMs = s => Math.max(0, (s.end || Math.min(Date.now(), lastAct(s) + H3)) - s.start);

// 每週重置：帳號設定星期與時間；回傳 t 之後的下一次
function nextWeekly(a, t) {
  if (a.wDay == null || a.wDay === '' || !a.wTime) return null;
  const [hh, mm] = String(a.wTime).split(':').map(Number), d = new Date(t);
  d.setHours(hh, mm, 0, 0); d.setDate(d.getDate() + ((Number(a.wDay) - d.getDay() + 7) % 7));
  if (d.getTime() <= t) d.setDate(d.getDate() + 7);
  return d.getTime();
}
function quota(a) {
  const t = Date.now();
  const p5ok = a.p5 != null && a.p5At != null && (a.r5 ? a.r5 > t : t - a.p5At < H5);
  const wr = a.pwAt ? nextWeekly(a, a.pwAt) : null;
  const pwok = a.pw != null && a.pwAt != null && (wr ? wr > t : t - a.pwAt < 7 * DAY);
  const fullOn = !!a.full && (a.fullUntil || 0) > t, fullOld = !!a.full && !fullOn;
  const rem = fullOn ? 0 : Math.min(p5ok ? 100 - a.p5 : 100, pwok ? 100 - a.pw : 100);
  return { p5ok, pwok, fullOn, fullOld, rem, known: p5ok || pwok, nextW: nextWeekly(a, t) };
}
// 狀態：紅（已滿／快滿）＞黃（有人在用）＞灰（超過 3 小時沒動作）＞綠
function state(id) {
  const a = acct(id), q = quota(a), op = openOf(id).sort((x, y) => x.start - y.start), fresh = op.filter(s => !stale(s));
  let k, txt;
  if (q.fullOn) { k = 'full'; txt = a.fullKind === 'w' ? '本週已滿' : '已滿'; }
  else if ((q.p5ok && a.p5 >= 90) || (q.pwok && a.pw >= 90)) { k = 'full'; txt = '快滿了'; }
  else if (fresh.length) { k = 'busy'; txt = fresh.length + ' 人在用'; }
  else if (op.length) { k = 'idle'; txt = '可能忘了結束'; }
  else { k = 'ok'; txt = '沒人在用'; }
  return { id, k, txt, a, q, op, fresh };
}

/* ---------- 登入流程 ---------- */
let gateEl = null;
function gate(title, msg, btns, extra) {
  if (!gateEl) { gateEl = h('div', { class: 'gate' }); document.body.append(gateEl); }
  const box = h('div', { class: 'box' }, h('h1', null, title));
  if (msg) { const p = h('p'); p.innerHTML = msg; box.append(p); }
  if (extra) box.append(extra);
  const gb = h('div', { class: 'gb' });
  (btns || []).forEach(([t, fn, ghost]) => gb.append(h('button', { class: 'btn big' + (ghost ? ' ghost' : ' primary'), type: 'button', onclick: fn }, t)));
  box.append(gb); gateEl.replaceChildren(box);
}
const hideGate = () => { if (gateEl) { gateEl.remove(); gateEl = null; } };
const logout = () => { stopAll(); S.bind = null; BK.logout(); };
const fail = e => gate('讀不到資料', '錯誤訊息：' + esc((e && (e.message || e.code)) || '') + '<br>請重新整理；一直這樣的話請 LINE 管理者。', [['重新整理', () => location.reload()], ['換一個帳號', logout, 1]]);

function loginGate() {
  if (BK.inApp) {
    gate('請改用瀏覽器開啟', '你現在在 App 內建的瀏覽器裡，Google 不允許在這裡登入。<br>請按右上角選單，選「用瀏覽器開啟」，或複製網址貼到 Safari／Chrome。', [['複製網址', () => {
      const u = location.origin + location.pathname;
      (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('已複製網址'), () => prompt('請複製這個網址：', u));
    }]]);
    return;
  }
  // iPhone 從主畫面打開時，登入資料跟 Safari 分開存，第一次要再登入一次（之後會記住）
  const iosHome = navigator.standalone === true;
  gate(GROUP.name + ' AI 帳號看板', '看 ' + ACCTS.length + ' 個 Claude 帳號現在誰在用、還剩多少額度。<br>請用自己的 Google 帳號（Gmail）登入。' + (iosHome ? '<br><small>從主畫面打開的第一次要再登入一次，之後就會記住。</small>' : ''), [['用 Google 帳號登入', async () => {
    const err = await BK.login(); if (err) gate('登入沒有成功', esc(err), [['再試一次', loginGate]]);
  }]]);
}

BK.onAuth(u => { S.user = u; if (!u) { stopAll(); S.bind = null; root.replaceChildren(); loginGate(); } else boot(); });

async function boot() {
  gate('登入中', '正在確認身分…', []);
  let acc;
  try { acc = await BK.get('cb_config/access'); } catch (e) { fail(e); return; }
  if (!acc) {
    gate('第一次使用', '看板還沒有管理者。<br>按下面的按鈕，<b>' + esc(S.user.email) + '</b> 會成為管理者（可以看後台、改名單）。', [['設為管理者並開始', async () => {
      try { await BK.set('cb_config/access', { admins: [S.user.email] }); boot(); } catch (e) { fail(e); }
    }], ['換一個帳號', logout, 1]]);
    return;
  }
  S.access = acc; S.admin = (acc.admins || []).map(x => String(x).toLowerCase()).includes(S.user.email);
  let b = null; try { b = await BK.get('cb_bind/' + S.user.uid); } catch (_) {}
  if (!b) { pickName(); return; }
  S.bind = b; start();
}

const once = c => new Promise((res, rej) => { let un = null, done = false; un = BK.watch(c, null, l => { if (done) return; done = true; res(l); setTimeout(() => un && un()); }, rej); });

async function pickName() {
  let list;
  try { list = (await once('cb_members')).sort((a, b) => (a.order || 0) - (b.order || 0)); } catch (e) { fail(e); return; }
  if (!list.length) {
    if (S.admin) gate('還沒有成員名單', '先帶入預設的 ' + SEED.length + ' 人名單，分組之後可以在後台調整。', [['帶入預設名單', async () => { try { await seed(); pickName(); } catch (e) { fail(e); } }], ['換一個帳號', logout, 1]]);
    else gate('還沒有成員名單', '管理者還沒建立名單，請稍後再試，或 LINE 管理者。', [['重新整理', boot], ['換一個帳號', logout, 1]]);
    return;
  }
  const box = h('div', { class: 'names' }, ACCTS.concat(['']).map(id => {
    const ms = list.filter(m => (m.acct || '') === id); if (!ms.length) return null;
    return h('div', { class: 'grp' }, h('b', null, id ? DEF_ACCT[id] : '未分組'), h('div', null, ms.map(m => h('button', { class: 'chip-b', type: 'button', onclick: () => confirmName(m) }, m.name))));
  }));
  gate('你是哪一位？', '第一次登入請選自己的名字。<br><small>' + esc(S.user.email) + '</small>', [['換一個 Google 帳號', logout, 1]], box);
}
function confirmName(m) {
  gate('你是 ' + esc(m.name) + ' 嗎？', '這個 Google 帳號（' + esc(S.user.email) + '）會和「' + esc(m.name) + '」綁在一起，之後登入就直接進看板。<br>選錯了請找管理者解除。', [['對，是我', async () => {
    const b = { mid: m.id, email: S.user.email, gname: S.user.name || '', at: Date.now() };
    try { await BK.set('cb_bind/' + S.user.uid, b); S.bind = b; start(); } catch (e) { fail(e); }
  }], ['重選', pickName, 1]]);
}
async function seed() {
  await Promise.all(SEED.map(([name, title, ac], i) => BK.set('cb_members/m' + pad(i + 1), { name, title, acct: ac, level: '', order: i + 1 })));
  await Promise.all(ACCTS.map(id => BK.set('cb_accounts/' + id, { name: DEF_ACCT[id] }, true)));
}

let unsubs = [];
function stopAll() { unsubs.forEach(f => { try { f(); } catch (_) {} }); unsubs = []; }
function start() {
  hideGate(); stopAll();
  let failed = false;
  const err = e => { if (failed) return; failed = true; stopAll(); if (/permission/i.test((e && (e.code || e.message)) || '')) boot(); else fail(e); };
  const W = (c, w, f) => unsubs.push(BK.watch(c, w, l => { f(l); render(); }, err));
  W('cb_members', null, l => { S.members = l.sort((a, b) => (a.order || 0) - (b.order || 0)); });
  W('cb_accounts', null, l => { S.accts = {}; l.forEach(a => { S.accts[a.id] = a; }); });
  W('cb_sessions', ['start', '>=', weekStart(Date.now()) - 8 * DAY], l => { S.recent = l; });
  W('cb_sessions', ['end', '==', null], l => { S.open = l; });
  W('cb_login', ['done', '==', false], l => { S.logins = l.sort((a, b) => a.at - b.at); });
  // 預計使用：資料庫規則還沒開通時只讓這一區顯示「還沒開通」，不影響整個看板
  S.plansOff = false;
  unsubs.push(BK.watch('cb_plans', ['end', '>=', todayStart()], l => { S.plans = l; render(); }, () => { S.plansOff = true; render(); }));
  if (S.admin) {
    W('cb_bind', null, l => { S.binds = l; });
    W('cb_config', null, l => { const a = l.find(d => d.id === 'access'); if (a) S.access = a; });
  }
  render();
}

/* ---------- 畫面 ---------- */
let rq = 0;
function render() { if (!rq) rq = requestAnimationFrame(() => { rq = 0; draw(); }); }
setInterval(render, 30000);
// 後台正在輸入時先不重畫（離開輸入框再補畫），免得打到一半被洗掉
root.addEventListener('focusout', () => setTimeout(render, 50));
function draw() {
  if (!S.bind || !S.user) return;
  const ae = document.activeElement;
  if (ae && root.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  const y = window.scrollY;
  const page = S.tab === 'admin' && S.admin ? adminPage() : homePage();
  root.replaceChildren(h('div', { class: 'app' }, sidebar(), h('div', null, ptop(), page)));
  window.scrollTo(0, y);
  motion();
  tide(tideLvl());
  const n = S.admin ? S.logins.length : 0;
  document.title = (n ? '(' + n + ') ' : '') + GROUP.name + ' AI 帳號看板';
}

// 畫面整頁重畫，動效靠前後比對補回來：本週額度條從上次的長度長過去；別人更新時那個帳號那一列閃一下
const prevW = {}, prevSig = {}, prevTxt = {};
function motion() {
  root.querySelectorAll('.track i[data-w]').forEach(i => { i.getBoundingClientRect(); i.style.width = i.dataset.w + '%'; prevW[i.dataset.k] = i.dataset.w; });
  root.querySelectorAll('.q[data-acct]').forEach(el => {
    const id = el.dataset.acct, sig = el.dataset.sig;
    if (prevSig[id] != null && prevSig[id] !== sig && Date.now() - lastLocal > 2500) el.classList.add('flash');
    prevSig[id] = sig;
  });
}
// 背景水位：三個帳號平均已用多少（5 小時、本週取較緊的那個；已滿算 100、沒數字算 0）
const tideLvl = () => Math.round(ACCTS.reduce((t, id) => t + 100 - quota(acct(id)).rem, 0) / ACCTS.length);
let tideEl = null;
function tide(p) {
  // 水面只建一次放在 body 最前面，重畫時不重建，浪才不會每 30 秒跳回原點；第一次從底部漲上來
  if (!tideEl) { tideEl = h('div', { class: 'tide', 'aria-hidden': 'true' }); document.body.prepend(tideEl); tideEl.getBoundingClientRect(); }
  tideEl.style.setProperty('--lvl', p);
  tideEl.classList.toggle('hot', p >= 90);
}
// 倒數數字變了就往上翻一格
function rollTo(key, txt) {
  const old = prevTxt[key], el = h('span', { class: 'num' }); prevTxt[key] = txt;
  if (!old || old === txt || REDUCE) { el.textContent = txt; return el; }
  el.className = 'num roll'; el.append(h('span', { class: 'ro' }, old), h('span', { class: 'ri' }, txt));
  setTimeout(() => { el.className = 'num'; el.textContent = txt; }, 450);
  return el;
}

/* ---------- 看板 ---------- */
const todayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
function homePage() {

  out.append(h('div', { class: 'stamp num' }, (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()].slice(1) + '）' + hm(d) + ' 更新．大家的回報會即時出現．背景水位＝三個帳號平均已用 ' + tideLvl() + '%'));
  const tip = homeTip(); if (tip) out.append(tip);

    stale(s) ? h('span', { class: 'warn' }, '超過 3 小時沒有動作，看板上顯示「可能忘了結束」；還在用請按「我還在用」。') : null));
  const mine = S.logins.find(l => l.mid === m.id);

      h('section', { class: 'card' }, h('div', { class: 'ch' }, h('h2', null, '本週額度'), h('small', null, '已用')), ACCTS.map(weekRow)),

// 帳號分組：每個帳號一列，列出固定用它的人；正在用的人標 ◐（用別的帳號就標「在 某帳號」），自己的名牌是綠框
function groups(m) {
  const fresh = S.open.filter(s => !stale(s));
  const tagOf = p => {
    const s = fresh.find(x => x.mid === p.id);
    return h('span', { class: 'nt' + (p.id === m.id ? ' me' : '') + (s ? ' on' : '') },
      s ? h('i', { 'aria-hidden': 'true' }, SYM.busy) : null, p.name,

/* ---------- 預計使用（時間軸） ---------- */
// 一個帳號一列，橫軸是時間（預設 08–22，有登記超出就加寬）；虛線框＝預計，底下實心細條＝實際使用，橘線＝現在
const dayLabel = off => { const t = todayStart() + off * DAY, d = new Date(t); return off === 0 ? '今天' : off === 1 ? '明天' : WD[d.getDay()] + ' ' + (d.getMonth() + 1) + '/' + d.getDate(); };
const canEditPlan = p => S.admin || p.mid === myId();
const shortT = t => { const d = new Date(t); return d.getMinutes() ? d.getHours() + ':' + pad(d.getMinutes()) : String(d.getHours()); }; // 整點只寫「14」，框比較放得下
let tlScroll = null;
function timeline(m) {
  const off = S.planDay, d0 = todayStart() + off * DAY, d1 = d0 + DAY, t = Date.now();
  const plans = S.plans.filter(p => p.end > d0 && p.start < d1);
  const sess = off === 0 ? allSess().filter(s => s.start < d1 && (s.end || t) > d0) : [];
  const hrs = plans.map(p => [p.start, p.end]).concat(sess.map(s => [s.start, s.end || t]));
  let h0 = 8, h1 = 22;
  hrs.forEach(([a, b]) => { h0 = Math.min(h0, Math.floor((Math.max(a, d0) - d0) / HR)); h1 = Math.max(h1, Math.ceil((Math.min(b, d1) - d0) / HR)); });
  h0 -= h0 % 2; h1 += h1 % 2; // 刻度每 2 小時一個，頭尾都對齊到偶數整點
  const x = v => ((Math.min(Math.max(v, d0 + h0 * HR), d0 + h1 * HR) - d0 - h0 * HR) / ((h1 - h0) * HR) * 100);
  const days = h('div', { class: 'seg tl-days', role: 'tablist' }, [0, 1, 2, 3, 4, 5, 6].map(i => {
    const n = S.plans.filter(p => p.end > todayStart() + i * DAY && p.start < todayStart() + (i + 1) * DAY).length;
    return h('button', { type: 'button', role: 'tab', 'aria-selected': i === off ? 'true' : 'false', class: i === off ? 'on' : '', onclick: () => { S.planDay = i; tlScroll = null; render(); } }, dayLabel(i), n ? h('small', { class: 'num' }, ' ' + n) : null);
  }));
  const axis = h('div', { class: 'tl-axis num' }, h('span'), h('div', null, Array.from({ length: h1 - h0 + 1 }, (_, i) => h0 + i).filter(v => v % 2 === 0).map(v => h('span', { style: 'left:' + ((v - h0) / (h1 - h0) * 100) + '%' }, pad(v) + ':00'))));
  const rows = ACCTS.map((id, i) => {
    const mine = plans.filter(p => p.acct === id).sort((a, b) => a.start - b.start), ends = [];
    const blocks = mine.map(p => {
      let lane = ends.findIndex(e => e <= p.start); if (lane < 0) lane = ends.length; ends[lane] = p.end;
      const l = x(p.start), w = Math.max(x(p.end) - l, 1.5);
      return h('button', { type: 'button', class: 'pl' + (p.mid === m.id ? ' me' : ''), style: 'left:' + l + '%;width:' + w + '%;top:' + (lane * 42 + 6) + 'px', title: mname(p.mid, p.name) + ' ' + hm(p.start) + '–' + hm(p.end) + (p.note ? '．' + p.note : ''), onclick: () => planInfo(p) },
        h('b', null, mname(p.mid, p.name)), h('span', { class: 'num' }, shortT(p.start) + '–' + shortT(p.end)));
    });
    const bars = sess.filter(s => s.acct === id).map(s => h('i', { class: 'ss', style: 'left:' + x(s.start) + '%;width:' + Math.max(x(s.end || t) - x(s.start), 0.8) + '%', title: mname(s.mid, s.name) + ' 實際 ' + hm(s.start) + '–' + (s.end ? hm(s.end) : '使用中') }));
    const now = off === 0 && t > d0 + h0 * HR && t < d0 + h1 * HR ? h('i', { class: 'now', style: 'left:' + x(t) + '%' }) : null;
    return h('div', { class: 'tl-row' + (i % 2 ? ' alt' : '') }, h('b', null, aname(id)),
      h('div', { class: 'tl-track', style: '--n:' + (h1 - h0) + ';height:' + (Math.max(1, ends.length) * 42 + 16) + 'px' }, blocks, bars, now));
  });
  const sc = h('div', { class: 'tl tw', onscroll: e => { tlScroll = e.target.scrollLeft; } }, h('div', { class: 'tl-in' }, axis, rows));
  // 手機上時間軸可以左右滑：重畫時保留位置，第一次打開今天就捲到現在
  requestAnimationFrame(() => { if (!sc.isConnected) return; sc.scrollLeft = tlScroll != null ? tlScroll : off === 0 ? Math.max(0, sc.scrollWidth * x(t) / 100 - sc.clientWidth / 3) : 0; });
  return h('section', { class: 'card' },
    h('div', { class: 'ch' }, h('h2', null, '預計使用'), h('small', null, '登記你預計什麼時候用哪個帳號，大家都看得到'),

const KEEP = {};
// 有輸入框的區塊：資料沒變就沿用；改到一半（dirty）也不重建
function keep(key, sig, build) {
  const c = KEEP[key];
  if (c && (c.dirty || c.sig === sig)) return c.el;
  const el = build(), e = { el, sig, dirty: false }; KEEP[key] = e;
  const mark = ev => { if (ev.target.matches('input,select,textarea')) e.dirty = true; };
  el.addEventListener('input', mark); el.addEventListener('change', mark);
  return el;
}
const unkeep = k => { delete KEEP[k]; render(); };

  return sec('名單與分組', '改完按「儲存名單」。用量填重／中／輕，方便平均分配（每個帳號重度最多 1–2 人）。', h('div', { class: 'sum' }, cnt), box,
    h('div', { class: 'row', style: 'border:0' }, save, add, seedBtn, h('span', { class: 'sp' }), h('button', { class: 'btn sm ghost', type: 'button', onclick: () => unkeep('members') }, '放棄修改')));
}

function acctEditor() {
  const blocks = ACCTS.map(id => {
    const a = acct(id);
    const nm = h('input', { class: 'in', value: aname(id) });
    const em = h('input', { class: 'in', type: 'email', value: a.email || '', placeholder: '登入 claude.ai 的信箱', autocomplete: 'off' });
    const p5 = numIn(a.p5), r5 = h('input', { type: 'datetime-local', class: 'in', value: toLocal(a.r5) });
    const pw = numIn(a.pw), wd = sel([['', '未設定']].concat(WD.map((t, i) => [i, t])), a.wDay), wt = h('input', { type: 'time', class: 'in', value: a.wTime || '' });
    const fl = h('input', { type: 'checkbox', style: 'width:22px;height:22px' }); fl.checked = !!a.full;
    const fu = h('input', { type: 'datetime-local', class: 'in', value: toLocal(a.fullUntil) });
    const save = h('button', { class: 'btn sm primary', type: 'button', onclick: async () => {
      const t = Date.now(), d = { name: nm.value.trim() || DEF_ACCT[id], email: em.value.trim().toLowerCase(), wDay: wd.value === '' ? null : Number(wd.value), wTime: wt.value || null, full: fl.checked, fullUntil: fromLocal(fu.value), r5: fromLocal(r5.value) };
      const n5 = pct(p5.value), nw = pct(pw.value);
      if (n5 !== (a.p5 == null ? null : a.p5)) { d.p5 = n5; d.p5At = n5 == null ? null : t; }
      if (nw !== (a.pw == null ? null : a.pw)) { d.pw = nw; d.pwAt = nw == null ? null : t; }
      if (fl.checked && !d.fullUntil) d.fullUntil = t + H5;
      if (fl.checked && !a.full) Object.assign(d, { fullKind: '5', fullBy: myId(), fullAt: t });
      if (d.p5At || d.pwAt) Object.assign(d, { by: myId(), at: t, auto: false });
      if (await act(() => BK.set('cb_accounts/' + id, d, true), aname(id) + ' 已儲存')) unkeep('accts');
    } }, '儲存');
    return h('div', { class: 'ablk' }, field('名稱', nm), field('登入信箱', em), field('5 小時已用', p5, '%'), field('5 小時重置', r5), field('本週已用', pw, '%'),
      h('div', { class: 'field' }, h('span', null, '每週重置'), wd, wt), h('label', { class: 'field' }, h('span', null, '標示已滿'), fl, fu), h('div', null, save));
  });
  return sec('帳號設定與額度修正', '「每週重置」照 claude.ai 用量頁寫的星期和時間填一次，之後會自動往後推。額度數字填錯可以在這裡改，清空就是「尚無回報」。「登入信箱」填了，裝了自動回報的同仁用 Claude Code 時就會自動更新額度和每週重置。', h('div', { class: 'agrid' }, blocks));
}

function bindList() {
  const list = S.binds.slice().sort((a, b) => (mname(a.mid) > mname(b.mid) ? 1 : -1));
  const dup = new Set(list.map(b => b.mid).filter((m, i, a) => a.indexOf(m) !== i));
  const none = S.members.filter(m => !list.some(b => b.mid === m.id)).map(m => m.name);
  return [list.length ? h('div', null, list.map(b => h('div', { class: 'row' },
    h('span', null, b.gname || '（無名稱）'), h('small', null, b.email), dup.has(b.mid) ? tag('同一個名字有兩個帳號', 'warm') : null, h('span', { class: 'sp' }),
    sel(memOpts(), b.mid, { 'aria-label': '對應的名字', style: 'min-height:36px;padding:4px 8px;font-size:14px', onchange: e => act(() => BK.update('cb_bind/' + b.id, { mid: e.target.value }), '已改成 ' + mname(e.target.value)) }),
    h('button', { class: 'btn sm danger', type: 'button', onclick: () => confirmSheet('解除綁定？', b.email + ' 下次登入要重新選名字。', '解除', () => BK.del('cb_bind/' + b.id)) }, '解除')))) : h('p', { class: 'muted' }, '還沒有人登入。'),
    none.length ? h('p', { class: 'muted' }, '還沒登入過：' + none.join('、')) : null];
}

function adminsEditor() {
  const ta = h('textarea', { class: 'in', rows: '3', placeholder: '一行一個 Gmail' }); ta.value = ((S.access || {}).admins || []).join('\n');
  const save = h('button', { class: 'btn sm primary', type: 'button', onclick: async () => {
    const list = [...new Set(ta.value.split(/[\s,;，、]+/).map(x => x.trim().toLowerCase()).filter(x => /@/.test(x)))];
    if (!list.includes(S.user.email)) list.push(S.user.email);
    if (await act(() => BK.set('cb_config/access', { admins: list }, true), '管理者名單已儲存')) unkeep('admins');
  } }, '儲存');
  return sec('管理者', '名單上的 Gmail 看得到後台。驗證碼代理人也加在這裡，就看得到「等驗證碼」。', ta, h('div', null, save));
}

/* ---------- 下拉重新整理：只在加到主畫面的 app 裡（瀏覽器本身就有）；網址加 ?ptr=1 可在一般瀏覽器測試 ---------- */
(function pullToRefresh() {
  const home = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (!home && !/[?&]ptr=1/.test(location.search)) return;
  document.documentElement.classList.add('home');
  const TH = 64, MAX = 96;
  const tip = h('span', null, '下拉重新整理');
  const pill = h('div', { class: 'ptr', 'aria-hidden': 'true' }, h('i', null), tip);
  document.body.append(pill);
  let y0 = null, d = 0, busy = false;
  const show = v => {
    d = v;
    pill.style.transform = 'translate(-50%,' + Math.round(v - 52) + 'px)';
    pill.style.opacity = Math.min(1, v / TH * 1.4);
    pill.firstChild.style.transform = 'rotate(' + Math.round(v / TH * 270) + 'deg)';
    pill.classList.toggle('go', v >= TH);
    tip.textContent = v >= TH ? '放開重新整理' : '下拉重新整理';
  };
  addEventListener('touchstart', e => {
    y0 = (busy || sheetEl || scrollY > 0 || e.touches.length > 1) ? null : e.touches[0].clientY;
    pill.classList.remove('back');
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0;
    show(dy > 0 && scrollY <= 0 ? Math.min(MAX, dy * 0.5) : 0);
  }, { passive: true });
  const end = () => {
    if (y0 == null) return;
    y0 = null;
    if (d >= TH) {
      busy = true; pill.classList.add('spin'); tip.textContent = '重新整理中…';
      setTimeout(() => location.reload(), 250);
    } else { pill.classList.add('back'); show(0); }
  };
  addEventListener('touchend', end);
  addEventListener('touchcancel', end);
})();
})();
</script>
